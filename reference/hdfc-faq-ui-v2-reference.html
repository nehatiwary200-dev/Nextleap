<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HDFC MF FAQ Assistant</title>
<style>
:root{
  --bg:#0d0810; --side:#120b16; --panel:#19111e; --border:#2b2033; --text:#f3edf6; --muted:#9a8ea3;
  --accent:#9b3fd1; --accent2:#c58cf0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.app{display:flex;height:100%}

/* Sidebar */
aside{width:270px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;flex:none;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:650;font-size:15px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-style:normal;font-size:15px}
.new{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.new:hover{border-color:var(--accent2)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:20px 10px 8px}
#history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.h{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--muted);cursor:pointer}
.h span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h:hover{background:var(--panel);color:var(--text)}
.h.on{background:var(--panel);color:var(--text)}
.h button{background:none;border:0;color:var(--muted);cursor:pointer;opacity:0;font-size:15px;line-height:1}
.h:hover button{opacity:1}
.h button:hover{color:#ff8a9b}
.empty{font-size:13px;color:var(--muted);padding:6px 10px}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(900px 500px at 85% -10%,rgba(155,63,209,.25),transparent 60%),var(--bg)}
.top{display:none;align-items:center;gap:10px;padding:12px 16px}
.menu{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.col{width:100%;max-width:820px;margin:0 auto;padding:0 20px}
#chat{flex:1;overflow-y:auto;padding-top:28px;padding-bottom:12px}
#chat .col{display:flex;flex-direction:column;gap:14px}

/* Hero */
.hero{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px}
.empty-state .hero{display:flex}
.empty-state #chat{display:none}
.orb{width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#e7c8ff 0,#9b3fd1 35%,#3b1466 70%,#1c0a33 100%);
  box-shadow:0 0 60px rgba(155,63,209,.55),inset 0 -10px 22px rgba(80,160,255,.45);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{font-size:clamp(24px,4vw,34px);font-weight:500;letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:14.5px;max-width:460px;line-height:1.5}

/* Messages */
.msg{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.55;font-size:15px;animation:in .25s ease}
.msg.bot{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:6px;align-self:flex-start}
.msg.user{background:linear-gradient(135deg,var(--accent),#7a2fb0);border-bottom-right-radius:6px;align-self:flex-end}
.src{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent2);text-decoration:none}
.src:hover{text-decoration:underline}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.4;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* Dock */
.dock{padding-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.chip{border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:13.5px;padding:9px 16px;border-radius:99px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent2);background:rgba(155,63,209,.15)}
.chat-state .chips{display:none}
.box{background:var(--panel);border:1px solid #5a3f6b;border-radius:20px;padding:16px 16px 12px;transition:.15s}
.box:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(155,63,209,.2)}
.row{display:flex;gap:12px;align-items:flex-start}
.spark{color:var(--accent2);font-size:20px;line-height:26px}
textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15.5px;line-height:26px;max-height:160px;min-height:52px}
textarea::placeholder{color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s}
.send:hover{filter:brightness(1.15)}
.send:disabled{opacity:.35;cursor:not-allowed}

@media(max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-100%);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  aside.open{transform:none}
  .top{display:flex}.msg{max-width:92%}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><i>📊</i> HDFC MF Assistant</div>
    <button class="new" id="new">＋ New chat</button>
    <div class="label">History</div>
    <div id="history"></div>
  </aside>

  <main id="main" class="empty-state">
    <div class="top"><button class="menu" id="menu" aria-label="Menu">☰</button></div>

    <div class="col hero">
      <div class="orb"></div>
      <h1>Ask about HDFC mutual funds</h1>
      <p>Factual answers on expense ratio, exit load, lock-in, benchmark and more, with one source link each.</p>
    </div>

    <section id="chat"><div class="col" id="msgs"></div></section>

    <div class="col dock">
      <div class="chips" id="chips">
        <button class="chip">Expense ratio?</button>
        <button class="chip">ELSS lock-in?</button>
        <button class="chip">Minimum SIP?</button>
        <button class="chip">Exit load?</button>
      </div>
      <div class="box">
        <div class="row">
          <span class="spark">✦</span>
          <textarea id="q" rows="1" placeholder="Ask anything about HDFC schemes..."></textarea>
        </div>
        <div class="foot">
          <span class="hint">Facts only. Not investment advice.</span>
          <button class="send" id="send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const main=$('main'),msgs=$('msgs'),chat=$('chat'),q=$('q'),send=$('send'),hist=$('history'),side=$('side');
let chats=[],cur=null;

try{chats=JSON.parse(localStorage.getItem('hdfc_chats')||'[]')}catch(e){chats=[]}
const save=()=>{try{localStorage.setItem('hdfc_chats',JSON.stringify(chats))}catch(e){}};

/* REPLACE with your real RAG backend call. Expected return: {answer, source} */
async function ask(question){
  await new Promise(r=>setTimeout(r,900));
  return {answer:'Demo reply. Connect ask() to your RAG backend to get real answers.',source:'https://groww.in'};
}

function bubble(role,text,src){
  const d=document.createElement('div');d.className='msg '+role;
  const p=document.createElement('div');p.textContent=text;d.appendChild(p);
  if(src){const a=document.createElement('a');a.className='src';a.href=src;a.target='_blank';a.rel='noopener';a.textContent='Source ↗';d.appendChild(a);}
  msgs.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}

function setState(){
  const has=cur&&cur.messages.length;
  main.classList.toggle('empty-state',!has);
  main.classList.toggle('chat-state',!!has);
}

function renderHistory(){
  hist.innerHTML='';
  if(!chats.length){hist.innerHTML='<div class="empty">No chats yet</div>';return;}
  chats.forEach(c=>{
    const el=document.createElement('div');el.className='h'+(cur&&cur.id===c.id?' on':'');
    const t=document.createElement('span');t.textContent=c.title;
    const x=document.createElement('button');x.textContent='×';x.title='Delete';
    x.onclick=e=>{e.stopPropagation();chats=chats.filter(k=>k.id!==c.id);save();if(cur&&cur.id===c.id)newChat();else renderHistory();};
    el.onclick=()=>open(c.id);
    el.append(t,x);hist.appendChild(el);
  });
}

function open(id){
  cur=chats.find(c=>c.id===id);msgs.innerHTML='';
  cur.messages.forEach(m=>bubble(m.role,m.text,m.src));
  setState();renderHistory();side.classList.remove('open');
}

function newChat(){
  cur=null;msgs.innerHTML='';setState();renderHistory();side.classList.remove('open');q.focus();
}

async function submit(text){
  text=text.trim();if(!text||send.disabled)return;
  if(!cur){cur={id:Date.now(),title:text.length>34?text.slice(0,34)+'…':text,messages:[]};chats.unshift(cur);}
  q.value='';q.style.height='auto';send.disabled=true;
  cur.messages.push({role:'user',text});setState();bubble('user',text);renderHistory();
  const t=document.createElement('div');t.className='msg bot';t.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
  msgs.appendChild(t);chat.scrollTop=chat.scrollHeight;
  let r;try{r=await ask(text)}catch(e){r={answer:'Something went wrong. Please try again.'}}
  t.remove();bubble('bot',r.answer,r.source);
  cur.messages.push({role:'bot',text:r.answer,src:r.source});save();
  send.disabled=false;q.focus();
}

send.onclick=()=>submit(q.value);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit(q.value)}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>submit(c.textContent));
$('new').onclick=newChat;
$('menu').onclick=()=>side.classList.toggle('open');

setState();renderHistory();
</script>
</body>
</html>
